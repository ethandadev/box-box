name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Doctor (smoke test)
        run: uv run box-box doctor
        continue-on-error: true  # CI runners have no audio devices

  launcher-windows:
    name: windows launcher finds or installs uv
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find or install uv like Box Box.bat does
        shell: cmd
        run: scripts\check_launcher.cmd

  smoke-windows:
    name: windows smoke test (real voice, speech, engine, UI)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/smoke.py
