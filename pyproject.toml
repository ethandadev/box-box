[project]
name = "box-box"
version = "0.1.0"
description = "An AI race engineer for F1 25 (2026 Season Pack): live telemetry, wheel push-to-talk, a real radio voice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
box-box = "box_box.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box_box"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
