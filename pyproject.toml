[project]
name = "box-box"
version = "1.1.0"
description = "An AI race engineer for F1 25 (2026 Season Pack): live telemetry, wheel push-to-talk, a real radio voice."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=1.13.0",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "pygame>=2.6.1",
    "pynput>=1.8.2",
    "sounddevice>=0.5.6",
]

[project.scripts]
box-box = "box_box.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box_box"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
